<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HelloClarenceGame - a small web-based RPG." />
    <meta name="theme-color" content="#070b14" />
    <title>Hello Clarence</title>

  <body>
    <div id="app">
      <div id="game" aria-label="Hello Clarence game canvas"></div>
